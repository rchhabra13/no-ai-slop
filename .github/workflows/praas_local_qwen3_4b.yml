name: praas-local-qwen3-4b

on:
  pull_request:
    types: [labeled]

# A reusable workflow only keeps the permissions its caller grants, so every caller
# grants the same set the shared workflow needs.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.label.name == 'praas-local-qwen3-4b' && github.event.sender.type != 'Bot'
    name: Review with praas-agent (openai/qwen3:4b)
    uses: ./.github/workflows/_praas-review.yml
    secrets: inherit
    with:
      model: "openai/qwen3:4b"
      max_model_tokens: "16384"
