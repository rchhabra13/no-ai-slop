name: _praas-review

on:
  workflow_call:
    inputs:
      model:
        description: "litellm-style model id, e.g. gemini/gemini-2.5-flash or openai/qwen3:4b"
        required: true
        type: string
      max_model_tokens:
        description: "Hard cap on tokens for this model (CONFIG__CUSTOM_MODEL_MAX_TOKENS)"
        required: false
        type: string
        default: "16384"

jobs:
  review:
    name: "Review (${{ inputs.model }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: praas-${{ inputs.model }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Check out the base branch, never the pull request head, so a pull request cannot
      # alter anything that runs in the same job as the repository secrets.
      - name: Check out base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      # OPENAI__API_BASE and the local key are only passed for openai/-prefixed (locally
      # served) models. litellm's api_base is a GLOBAL override, not scoped to the openai
      # provider — setting it unconditionally would route gemini/ calls at the local
      # endpoint and fail them. Cloud OpenAI ids carry no prefix and take the cloud key.
      - name: Review pull request
        env:
          PRAAS_IMAGE: ghcr.io/rchhabra13/praas-agent:v1
          PR_URL: ${{ github.event.pull_request.html_url }}
          CONFIG__GIT_PROVIDER: github
          GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI__API_BASE: ${{ startsWith(inputs.model, 'openai/') && secrets.LOCAL_LLM_BASE || '' }}
          OPENAI__KEY: ${{ startsWith(inputs.model, 'openai/') && secrets.LOCAL_LLM_KEY || secrets.OPENAI_API_KEY }}
          CONFIG__MODEL: ${{ inputs.model }}
          CONFIG__FALLBACK_MODELS: '[]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: ${{ inputs.max_model_tokens }}
          CONFIG__AI_TIMEOUT: "1800"
          PR_REVIEWER__REQUIRE_SCORE_REVIEW: "true"
          PR_REVIEWER__PERSISTENT_COMMENT: "false"
          PR_REVIEWER__ENABLE_MULTI_SUBAGENT_REVIEW: "true"
          IGNORE__GLOB: "[]"
          PR_REVIEWER__EXTRA_INSTRUCTIONS: ""
          PR_CODE_SUGGESTIONS__SUGGESTIONS_SCORE_THRESHOLD: "7"
        run: |
          set -euo pipefail
          docker pull "$PRAAS_IMAGE"
          praas_run() {
            docker run --rm \
              -e CONFIG__GIT_PROVIDER \
              -e GITHUB__USER_TOKEN \
              -e GOOGLE_AI_STUDIO__GEMINI_API_KEY \
              -e OPENAI__API_BASE \
              -e OPENAI__KEY \
              -e CONFIG__MODEL \
              -e CONFIG__FALLBACK_MODELS \
              -e CONFIG__CUSTOM_MODEL_MAX_TOKENS \
              -e CONFIG__AI_TIMEOUT \
              -e PR_REVIEWER__REQUIRE_SCORE_REVIEW \
              -e PR_REVIEWER__PERSISTENT_COMMENT \
              -e PR_REVIEWER__ENABLE_MULTI_SUBAGENT_REVIEW \
              -e IGNORE__GLOB \
              -e PR_REVIEWER__EXTRA_INSTRUCTIONS \
              -e PR_CODE_SUGGESTIONS__SUGGESTIONS_SCORE_THRESHOLD \
              "$PRAAS_IMAGE" \
              --pr_url "$PR_URL" "$1"
          }
          praas_run describe
          praas_run review
